name: cd

on:
    push:
        tags:
            - "v*"

jobs:
    build-test-package:
        name: Build/Test/Package (${{ matrix.os }})
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-2022]

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v4

            - name: Setup Ninja
              uses: seanmiddleditch/gha-setup-ninja@v5

            - name: Setup CMake
              uses: jwlawson/actions-setup-cmake@v2

            - name: Install Linux toolchain
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc g++ zip

            - name: Setup MSVC Dev Cmd
              if: runner.os == 'Windows'
              uses: ilammy/msvc-dev-cmd@v1

            - name: Configure (Linux / GCC)
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  cmake -S . -B out/build/release -G Ninja \
                    -DGS_ENABLE_TESTS=ON \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DGS_VERSION="${VERSION}" \
                    -DGS_GIT_REF="${GITHUB_REF}" \
                    -DGS_GIT_SHA="${GITHUB_SHA}" \
                    -DCMAKE_C_COMPILER=gcc \
                    -DCMAKE_CXX_COMPILER=g++

            - name: Configure (Windows / MSVC)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  $version = $env:GITHUB_REF_NAME.TrimStart("v")
                  cmake -S . -B out/build/release -G Ninja `
                    -DGS_ENABLE_TESTS=ON `
                    -DCMAKE_BUILD_TYPE=Release `
                    -DGS_VERSION="$version" `
                    -DGS_GIT_REF="$env:GITHUB_REF" `
                    -DGS_GIT_SHA="$env:GITHUB_SHA"

            - name: Build
              if: runner.os == 'Linux'
              shell: bash
              run: cmake --build out/build/release

            - name: Build (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: cmake --build out/build/release

            - name: Test
              if: runner.os == 'Linux'
              shell: bash
              run: ctest --test-dir out/build/release --output-on-failure

            - name: Test (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: ctest --test-dir out/build/release --output-on-failure

            - name: Package (Linux)
              if: runner.os == 'Linux'
              shell: bash
              run: |
                  set -euxo pipefail
                  mkdir -p dist/CPP_ECS_ARPG
                  cp out/build/release/gs_app dist/CPP_ECS_ARPG/
                  zip -r "CPP_ECS_ARPG-${GITHUB_REF_NAME}-${{ runner.os }}.zip" dist/CPP_ECS_ARPG

            - name: Package (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force -Path dist\CPP_ECS_ARPG | Out-Null
                  Copy-Item "out/build/release/gs_app.exe" "dist\CPP_ECS_ARPG\"
                  Compress-Archive -Path "dist\CPP_ECS_ARPG\*" -DestinationPath "CPP_ECS_ARPG-$env:GITHUB_REF_NAME-${{ runner.os }}.zip" -Force

            - name: Upload zip artifact
              uses: actions/upload-artifact@v4
              with:
                  name: CPP_ECS_ARPG-${{ github.ref_name }}-${{ runner.os }}
                  path: CPP_ECS_ARPG-${{ github.ref_name }}-${{ runner.os }}.zip

    release:
        name: Publish Release
        needs: build-test-package
        runs-on: ubuntu-latest
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts

            - name: Create Release
              uses: softprops/action-gh-release@v2
              with:
                  files: artifacts/**/**/*.zip
