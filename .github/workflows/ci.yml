name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
      # This action is specifically for ensuring CMake is available in PATH. :contentReference[oaicite:2]{index=2}

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B out/build/ci -G Ninja \
            -DGS_ENABLE_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          cmake --build out/build/ci --config Release

      - name: Test
        shell: bash
        run: |
          ctest --test-dir out/build/ci --output-on-failure
