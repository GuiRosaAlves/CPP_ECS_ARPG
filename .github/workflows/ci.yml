name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Install Linux toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++

      - name: Setup MSVC Dev Cmd
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Linux / GCC)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B out/build/ci -G Ninja \
            -DGS_ENABLE_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DGS_VERSION="0.0.0+${GITHUB_SHA:0:7}" \
            -DGS_GIT_REF="${GITHUB_REF}" \
            -DGS_GIT_SHA="${GITHUB_SHA}"

      - name: Configure (Windows / MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B out/build/ci -G Ninja `
            -DGS_ENABLE_TESTS=ON `
            -DCMAKE_BUILD_TYPE=Release `
            -DGS_VERSION="0.0.0+$short" `
            -DGS_GIT_REF="$env:GITHUB_REF" `
            -DGS_GIT_SHA="$env:GITHUB_SHA"

      - name: Build
        if: runner.os == 'Linux'
        shell: bash
        run: cmake --build out/build/ci

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build out/build/ci

      - name: Test
        if: runner.os == 'Linux'
        shell: bash
        run: ctest --test-dir out/build/ci --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ctest --test-dir out/build/ci --output-on-failure
